[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-run-replay"
version = "0.1.0"
description = "Local recording, inspection, diffing, and deterministic replay for agent executions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aniket Deshkar" }]
keywords = ["agents", "replay", "debugging", "jsonl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
agent-run-replay = "agent_run_replay.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_run_replay"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
